<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Celebrity Generator</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; background: #121212; color: #e0e0e0; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #6200ee; color: white; border: none; border-radius: 4px; }
        button:hover { background: #3700b3; }
        #output { margin-top: 20px; white-space: pre-wrap; background: #1e1e1e; padding: 20px; border-radius: 6px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h2>Dynamic Celebrity Generator</h2>
    <button onclick="generateCelebrity()">Generate Profile</button>
    <div id="output">Click the button to start...</div>

    <script>
        const celebPool = [
            "Lexi Lore",
            "Abella Danger",
            "Riley Reid",
            "Angela White"
        ];

        async function generateCelebrity() {
            const outputDiv = document.getElementById("output");
            const randomName = celebPool[Math.floor(Math.random() * celebPool.length)];
            
            outputDiv.innerHTML = "Consulting AI knowledge base for <b>" + randomName + "</b>...";

            try {
                const response = await puter.ai.chat(
                    `Write a short, engaging creative profile and physical description for adult film star ${randomName}. Keep it safe for work and tasteful.`
                );

                const textContent = typeof response === 'string' ? response : (response.message?.content || JSON.stringify(response));

                outputDiv.innerHTML = `<h3>${randomName}</h3><p>${textContent}</p>`;
                
            } catch (error) {
                outputDiv.innerHTML = "Error generating profile. Make sure you sign in to Puter if prompted.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
